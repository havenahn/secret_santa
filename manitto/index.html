<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7fb">
  <title>🎀 마니또</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">🎀</div>
      <h1>마니또</h1>
      <p>누가 누구의 마니또일까요?</p>
    </header>

    <section id="home" class="card">
      <h2>새 마니또 만들기</h2>
      <p class="muted">친구들의 이름을 입력하고 방을 만들어 주세요.</p>
      <label>참가자 수</label>
      <input id="count" type="number" min="2" max="100" inputmode="numeric" placeholder="예: 9">
      <button id="makeNames" class="primary">이름 입력하기</button>
      <div id="homeError" class="error"></div>
    </section>

    <section id="names" class="card hidden">
      <h2>참가자 이름</h2>
      <div id="nameInputs"></div>
      <button id="draw" class="primary">🎲 마니또 돌리기</button>
      <div id="nameError" class="error"></div>
    </section>

    <section id="room" class="card hidden">
      <div class="room-badge">ROOM</div>
      <div id="roomCode" class="room-code"></div>
      <p class="muted">아래 주소를 친구들에게 공유하세요.</p>
      <button id="copyLink" class="secondary">🔗 방 링크 복사</button>
      <div class="divider"></div>
      <h2>내 마니또 확인</h2>
      <label>내 이름</label>
      <select id="personSelect"></select>
      <button id="reveal" class="primary">🤫 내 마니또 보기</button>
      <div id="result" class="result"></div>
      <p class="tiny">결과는 본인에게만 보여주세요 🤫</p>
      <button id="newGame" class="secondary">새 마니또 만들기</button>
    </section>

    <section id="loading" class="card hidden center">
      <div class="spinner">🎀</div>
      <p>잠시만요...</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
