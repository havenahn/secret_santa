<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마니또</title></head>
<body>
<script>
const p=location.pathname;
const marker="/room/";
if(p.includes(marker)){
  const code=p.split(marker)[1].split("/")[0];
  location.replace(location.origin + location.pathname.split(marker)[0] + "?room="+encodeURIComponent(code));
}else{
  location.replace(location.origin + location.pathname.replace(/\/404\.html$/,"/"));
}
</script>
</body>
</html>
