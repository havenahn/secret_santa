<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><script>(function(){const base=location.pathname.split("/room/")[0].replace(/\/$/,"");const p=location.pathname;const m="/room/";if(p.toLowerCase().includes(m)){const code=p.split(m)[1].split("/")[0];location.replace(location.origin+base+"/?room="+encodeURIComponent(code))}else{location.replace(location.origin+base+"/")}})();</script></body></html>
