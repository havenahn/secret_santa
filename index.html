<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<title>🎀 마니또</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header><div class="logo">🎀</div><h1>마니또</h1><p>누가 누구의 마니또일까요?</p></header>

<section id="home" class="card">
<h2>마니또 방 입장</h2><p class="muted">친구에게 받은 방 키를 입력하세요.</p>
<label for="roomKey">방 키</label>
<input id="roomKey" type="text" maxlength="6" autocapitalize="characters" autocomplete="off" placeholder="예: 7K4P2A">
<button id="joinRoom" class="primary">방 들어가기</button>
<div id="homeError" class="error"></div>
<div class="divider"></div>
<button id="createRoom" class="secondary">새 마니또 만들기</button>
</section>

<section id="names" class="card hidden">
<h2>새 마니또 만들기</h2>
<div class="new-room-code-wrap"><div class="tiny">방 코드</div><div id="newRoomCode" class="new-room-code"></div><p class="tiny">이 코드를 친구들에게 알려주세요. 마니또를 돌린 후 방에 들어갈 수 있어요.</p></div>
<p class="muted">참가자 수와 이름을 입력하세요.</p>
<label for="count">참가자 수</label>
<input id="count" type="number" min="2" max="100" inputmode="numeric" placeholder="예: 9">
<button id="makeNames" class="primary">이름 입력하기</button>
<div id="nameInputs"></div>
<button id="draw" class="primary hidden">🎲 마니또 돌리기</button>
<div id="nameError" class="error"></div>
<button id="backHome" class="secondary">← 방 키 입력으로 돌아가기</button>
</section>

<section id="room" class="card hidden">
<div class="room-badge">ROOM</div><div id="roomCode" class="room-code"></div>
<p class="muted">친구들에게 방 키 또는 링크를 공유하세요.</p>
<button id="copyLink" class="secondary">🔗 방 링크 복사</button>
<div class="divider"></div>
<h2>내 마니또 확인</h2><label for="personSelect">내 이름</label>
<select id="personSelect"></select>
<button id="reveal" class="primary">🤫 내 마니또 보기</button>
<div id="result" class="result"></div>
<p class="tiny">결과는 본인에게만 보여주세요 🤫</p>
<button id="deleteRoom" class="danger">🗑️ 마니또 지우기</button>
<button id="newGame" class="secondary">새 마니또 만들기</button>
</section>

<section id="loading" class="card hidden center"><div class="spinner">🎀</div><p>방을 찾는 중...</p></section>
</main>
<script src="app.js"></script>
</body>
</html>
